services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        AI_EXTRAS: ${AI_EXTRAS:-ai}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    ports:
      - "8000:8000"
    # Load environment from .env file (supports both repo root and docker/ locations)
    # Priority: explicit environment > env_file values
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      # Database - always use internal Docker network hostname
      - DATABASE_URL=postgresql+asyncpg://horalix:horalix@postgres:5432/horalix_view
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=horalix
      - DB_PASSWORD=horalix
      - DB_NAME=horalix_view
      # Redis - always use internal Docker network hostname
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      # Security - MUST be set in .env or will use insecure default (dev only)
      - SECRET_KEY=${SECRET_KEY:-}
      # AI settings
      - AI_DEVICE=${AI_DEVICE:-cpu}
      - AI_MODELS_DIR=${AI_MODELS_DIR:-/app/models}
      - AI_RESULTS_DIR=${AI_RESULTS_DIR:-/app/results}
      - AI_HORALIX_AI_ENABLED=${AI_HORALIX_AI_ENABLED:-true}
      - AI_HORALIX_AI_MODELS_DIR=${AI_HORALIX_AI_MODELS_DIR:-/app/models/horalix_ai}
      - AI_HORALIX_AI_MODELS_ROOT=${AI_HORALIX_AI_MODELS_DIR:-/app/models/horalix_ai}
      - AI_HORALIX_AI_JOB_QUEUE_DIR=/app/job_queue
      - AI_HORALIX_AI_COMMAND=${AI_HORALIX_AI_COMMAND:-python -m app.services.ai.external_runners.horalix_ai --model $$MODEL_NAME}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-void}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
      # DICOM settings
      - DICOM_AE_TITLE=${DICOM_AE_TITLE:-HORALIX_VIEW}
      - DICOM_PORT=${DICOM_PORT:-11112}
      # Environment
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - ENABLE_DEMO_DATA=${ENABLE_DEMO_DATA:-false}
      - INIT_DEFAULT_USERS=${INIT_DEFAULT_USERS:-true}
      - AI_AUTO_LOAD_MODELS=${AI_AUTO_LOAD_MODELS:-false}
    volumes:
      - dicom-storage:/app/storage
      - ../models:/app/models
      - ../results:/app/results
      - ${HORALIX_AI_MODELS_HOST_PATH:-../models/horalix_ai}:/app/models/horalix_ai:ro
      - ../job_queue:/app/job_queue
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=horalix
      - POSTGRES_PASSWORD=horalix
      - POSTGRES_DB=horalix_view
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horalix -d horalix_view"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Worker 0 runs in all modes.
  # CPU mode: set AI_DEVICE=cpu and WORKER_0_GPU_COUNT=0
  # Single GPU: set AI_DEVICE=cuda:0 and WORKER_0_GPU_COUNT=1
  # Dual GPU: same as single GPU + enable --profile gpu (worker 1)
  horalix-ai-worker-0:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        AI_EXTRAS: ${AI_EXTRAS:-ai}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      # Database connection (needed by DicomLoader)
      - DATABASE_URL=postgresql+asyncpg://horalix:horalix@postgres:5432/horalix_view
      - DB_HOST=postgres
      - DB_PORT=5432
      # Redis connection
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      # AI settings
      - AI_DEVICE=${AI_DEVICE:-cpu}
      - AI_MODELS_DIR=/app/models
      - AI_RESULTS_DIR=/app/results
      - AI_HORALIX_AI_MODELS_ROOT=${AI_HORALIX_AI_MODELS_DIR:-/app/models/horalix_ai}
      - AI_HORALIX_AI_JOB_QUEUE_DIR=/app/job_queue
      - AI_HORALIX_AI_PRELOAD=${AI_HORALIX_AI_PRELOAD:-true}
      - AI_HORALIX_AI_NUM_WORKERS=${AI_HORALIX_AI_NUM_WORKERS:-1}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-void}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
      # DICOM storage
      - DICOM_STORAGE_DIR=/app/storage/dicom
    volumes:
      - dicom-storage:/app/storage:ro
      - ../models:/app/models
      - ../results:/app/results
      - ${HORALIX_AI_MODELS_HOST_PATH:-../models/horalix_ai}:/app/models/horalix_ai:ro
      - ../job_queue:/app/job_queue
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${WORKER_0_GPU_COUNT:-0}
              capabilities: [gpu]
    command: python -m app.services.ai.horalix_ai.worker --gpu-id 0
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time; st=os.path.getmtime('/app/job_queue/status/worker_0_heartbeat') if os.path.exists('/app/job_queue/status/worker_0_heartbeat') else 0; assert time.time()-st<120, 'stale'"]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional second worker (GPU 1) for dual-GPU systems.
  # Start with: docker compose --profile gpu ...
  horalix-ai-worker-1:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        AI_EXTRAS: ${AI_EXTRAS:-ai}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://horalix:horalix@postgres:5432/horalix_view
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - AI_DEVICE=cuda
      - AI_MODELS_DIR=/app/models
      - AI_RESULTS_DIR=/app/results
      - AI_HORALIX_AI_MODELS_ROOT=${AI_HORALIX_AI_MODELS_DIR:-/app/models/horalix_ai}
      - AI_HORALIX_AI_JOB_QUEUE_DIR=/app/job_queue
      - AI_HORALIX_AI_PRELOAD=${AI_HORALIX_AI_PRELOAD:-true}
      - AI_HORALIX_AI_NUM_WORKERS=${AI_HORALIX_AI_NUM_WORKERS:-2}
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - CUDA_VISIBLE_DEVICES=1
      - DICOM_STORAGE_DIR=/app/storage/dicom
    volumes:
      - dicom-storage:/app/storage:ro
      - ../models:/app/models
      - ../results:/app/results
      - ${HORALIX_AI_MODELS_HOST_PATH:-../models/horalix_ai}:/app/models/horalix_ai:ro
      - ../job_queue:/app/job_queue
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    command: python -m app.services.ai.horalix_ai.worker --gpu-id 1
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time; st=os.path.getmtime('/app/job_queue/status/worker_1_heartbeat') if os.path.exists('/app/job_queue/status/worker_1_heartbeat') else 0; assert time.time()-st<120, 'stale'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  dicom-storage:
